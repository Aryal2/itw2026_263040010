<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Element Form di dalam Tabel</title>
</head>
<body>
    <h1>Coba Element Form di dalam Tabel</h1>

    <form action="proses.php" method="post">
        <table Cellpadding="5">
            <tr>
                <td align="right"><label for="nama">Nama:</label></td>
                <td><input type="text" id="nama" name="nama"></td>
            </tr>
            <tr>
                <td align="right"><label for="email">Email:</label></td>
                <td><input type="email" id="email" name="email"></td>
            </tr>
            <tr>
                <td align="right"><label for="number">Nomor Telepon:</label></td>
                <td><input type="tel" id="number" name="number"></td>
            </tr>
            <tr>
                <td align="right"><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="password"></td>
            </tr>
            <tr>
                <td align="right"><label for="country">Negara:</label></td>
                <td>
                    <select id="country" name="country">
                        <option value="pilih negara"></option>
                        <option value="indonesia">Indonesia</option>
                        <option value="malaysia">Malaysia</option>
                        <option value="singapore">Singapura</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td align="right"><label for="gender">Jenis Kelamin:</label></td>
                <td>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Laki-laki</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td align="right"><label for="hobby">Hobi:</label></td>
                <td>
                    <input type="checkbox" id="reading" name="hobby[]" value="reading">
                    <label for="reading">Membaca</label>
                    <input type="checkbox" id="traveling" name="hobby[]" value="traveling">
                    <label for="traveling">Bepergian</label>
                </td>
            </tr>
        </table>

        <br>

        <button type="submit">Kirim!</button>
    </form>
</body>
</html>
