<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input Atribut, checkbox, & radio button</title>
</head>
<body>
    <h1>contoh Input Atribut, checkbox, & radio button</h1>

    <form action="proses.php" method="post">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="number">Nomor Telepon:</label>
        <input type="tel" id="number" name="number"><br><br>    

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>

        <label for="gender">Jenis Kelamin:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Laki-laki</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Perempuan</label><br><br>

        <label for="hobby">Hobi:</label>
        <input type="checkbox" id="reading" name="hobby[]" value="reading">
        <label for="reading">Membaca</label>
        <input type="checkbox" id="traveling" name="hobby[]" value="traveling">
        <label for="traveling">Bepergian</label><br><br>

        <input type="submit" value="Submit">
</body>
</html>
